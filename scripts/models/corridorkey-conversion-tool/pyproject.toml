# SPDX-License-Identifier: AGPL-3.0-only
[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "framescaper-corridorkey-conversion-candidate"
version = "0.1.0"
description = "Offline CorridorKey conversion candidate; no model publication"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
    "einops==0.8.0",
    "huggingface-hub==1.5.0",
    "numpy==1.26.4",
    "onnx==1.22.0",
    "onnx-ir==1.1.0",
    "onnxruntime==1.20.1",
    "onnxscript==0.7.2",
    "opencv-python==4.11.0.86",
    "pillow==13.0.0",
    "protobuf==5.29.6",
    "safetensors==0.6.2",
    "scipy==1.16.3",
    "timm==1.0.22",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "tqdm==4.67.1",
    "transformers==5.10.4",
    "utils3d @ git+https://github.com/EasternJournalist/utils3d.git@83bfa5bda008803f6521ce9547f94023b8afeddd",
]

[project.scripts]
corridorkey-conversion-candidate = "framescaper_corridorkey_conversion.__main__:main"

[tool.setuptools]
packages = ["framescaper_corridorkey_conversion"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

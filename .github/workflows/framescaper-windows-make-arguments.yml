name: Diagnose Windows Make argument delivery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
          - runner: windows-11-vs2026-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install x64 Make
        if: matrix.arch == 'x64'
        shell: pwsh
        run: choco install make --yes --no-progress
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Select native Windows tooling
        uses: ./.github/actions/setup-native-tooling
        with:
          windows-media-tools: 'true'
      - run: npm install --global npm@12.0.1
      - run: npm ci
      - name: Measure long argument delivery through each installed Git shell
        run: node scripts/diagnose-windows-make-arguments.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-make-argument-probe-${{ matrix.arch }}
          path: windows-make-argument-probe.json
          if-no-files-found: warn
          retention-days: 7

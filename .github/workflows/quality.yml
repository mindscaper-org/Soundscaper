name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_translations:
        description: Publish the exact translation-sync commit after all Quality gates
        type: boolean
        default: false
      translation_sync_sha:
        description: Exact pushed translation-sync commit to publish
        type: string
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  # Stale pull-request results can be discarded. Main runs may deploy, and
  # manually dispatched work should not be interrupted by a later invocation.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep four static jobs independent, but run each check's internal shards
  # sequentially. Together with four browser shards per engine, the dependency
  # graph permits at most 19 concurrent jobs, leaving one of the organization's
  # 20 runner slots for other workflows. The complete run schedules 25 jobs.
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Preserve handbook last-updated history when reusing its checked output.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      # Restore the installed tree so parallel checks avoid repeated installs.
      - name: Restore or install verified dependencies
        uses: ./.github/actions/verified-node-dependencies
        with:
          scope: ubuntu-24.04

      - name: Check and build the Soundscaper handbook
        run: npm run docs:check

      - name: Build the site
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # `hidden` maps, written to `dist-source-maps/` rather than into
          # `dist/`, are what lets the Chromium browser jobs read a bundled chunk
          # back onto `src/`. The emitted JavaScript is unchanged — no
          # `sourceMappingURL` comment is added and no map is left in the output
          # — so this artifact stays the build the browser jobs are supposed to
          # exercise. The deploy job builds its own map-free output regardless.
          SCAPE_BUILD_SOURCE_MAPS: '1'

      - name: Measure the built transfer documents against the build just made
        # The `tests` shards below never build, so the three assertions in this
        # file that read `dist/` skipped in every CI run - and they are the only
        # ones that can see the edge that matters: rolldown injects
        # `vite/preload-helper` into the transfer chunk for its dynamic archive
        # import, the `$initial` site-entry group owns the helper together with
        # react-dom, and no source-level model of the import closure can see
        # that. This is the one job that holds a build, so it is the job that
        # measures it. The variable makes an absent `dist/` a failure here rather
        # than a skip, so the guard cannot quietly stand itself down again.
        run: node --import tsx --import ./scripts/node-style-asset-loader.mjs --test tests/project-transfer-standalone-page-chunks.test.ts
        env:
          SOUNDSCAPER_TRANSFER_BUILD_REQUIRED: '1'

      - name: Build and verify the Framescaper browser site
        run: npm run build:browser:framescaper

      - name: Prepare and verify the ordinary Soundscaper browser site once
        run: npm run prepare:browser:products
        env:
          SCAPE_BROWSER_COVERAGE: '1'

      - name: Record the checked Soundscaper handbook
        run: node scripts/ci-handbook-build.mjs record

      - name: Upload the checked Soundscaper handbook
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checked-soundscaper-handbook-${{ github.sha }}
          path: |
            handbook/dist/
            handbook/.ci-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload the verified website build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-site-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Upload the prepared Soundscaper browser site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-soundscaper-browser-site-build
          path: .wrangler/browser-products/soundscaper/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload the verified Framescaper website build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-framescaper-site-build
          path: .wrangler/browser-products/framescaper/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload the website build's source maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-site-source-maps
          path: dist-source-maps/
          if-no-files-found: error
          retention-days: 1

      - name: Upload the Framescaper website build's source maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-framescaper-site-source-maps
          path: .wrangler/browser-products/framescaper-source-maps/
          if-no-files-found: error
          retention-days: 1

      - name: Prepare one fresh desktop test runtime for the common shards
        uses: ./.github/actions/prepare-desktop-runtime-test-fixture

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    # Run 40399230221 spent about 23 minutes across its eight lint shards.
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      # Reuse the installed tree while the lint runner walks every shard.
      - name: Restore the installed dependency tree
        id: dependency-tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: >-
            node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'patches/npm/*.patch') }}

      - name: Install dependencies
        if: steps.dependency-tree.outputs.cache-hit != 'true'
        run: npm ci

      - name: Lint every shard
        run: npm run lint
        env:
          # Type-aware linting exhausts the default old-space limit and dies with
          # "Ineffective mark-compacts near heap limit" before it reports a single
          # rule. The ubuntu-24.04 runner has 16 GiB.
          NODE_OPTIONS: --max-old-space-size=8192

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      # Reuse the installed tree while TypeScript checks each project in turn.
      - name: Restore the installed dependency tree
        id: dependency-tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: >-
            node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'patches/npm/*.patch') }}

      - name: Install dependencies
        if: steps.dependency-tree.outputs.cache-hit != 'true'
        run: npm ci

      - name: Type-check every project
        run: npm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  audits:
    name: Architecture, audits and handbook
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # `npm run audit:ci` reads revision-bound Git inputs, so this one cannot
          # run against a depth-1 clone.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      # Twelve gate jobs each writing 891 packages is what the split actually
      # costs: `npm ci` takes twelve seconds in one job and five minutes in
      # twelve, even though setup-node's package cache hits in every one of them.
      # Restoring the installed tree is one archive extract instead, so the gate
      # spends its time on the checks rather than on installing.
      - name: Restore the installed dependency tree
        id: dependency-tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: >-
            node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'patches/npm/*.patch') }}

      - name: Install dependencies
        if: steps.dependency-tree.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check the architecture rules
        run: npm run check:architecture
        env:
          CONTROLLER_DOMAIN_BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}
          MAINTAINABILITY_BASE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || github.sha }}

      - name: Audit the pinned third-party payloads
        run: npm run audit:ci

      - name: Build the Framescaper handbook
        run: npm run docs:build
        env:
          SCAPE_PRODUCT: framescaper

  native-platform-compile:
    name: Native compile / ${{ matrix.target.platform }} / ${{ matrix.target.arch }}
    needs: [build, lint, typecheck, audits]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - runner: windows-2025
            platform: win
            arch: x64
            node_arch: x64
            cmake_arch: x64
            native_target: win-x64
          - runner: windows-11-arm
            platform: win
            arch: arm64
            node_arch: arm64
            cmake_arch: ARM64
            native_target: win-arm64
          - runner: macos-15
            platform: mac
            arch: arm64
            node_arch: arm64
            native_target: mac-arm64
    runs-on: ${{ matrix.target.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          architecture: ${{ matrix.target.node_arch }}
          cache: npm

      - name: Set up native tooling
        uses: ./.github/actions/setup-native-tooling

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Verify Windows GPU CMake recipes
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: node --import tsx --test tests/desktop-assistance-gpu-cmake.test.ts tests/desktop-assistance-sherpa-cmake.test.ts tests/desktop-assistance-vulkan-cmake.test.ts tests/desktop-assistance-build-process.test.ts

      - name: Verify durable native manifest staging
        run: node --import tsx --test tests/soundscaper-professional-native-manifest-sync.test.ts

      - name: Build and test the authenticated target-native OS audio codec host
        run: >-
          node scripts/ci-build-os-audio-codec-host.mjs
          --desktop-platform=${{ matrix.target.platform }}
          --desktop-arch=${{ matrix.target.arch }}
          --runner-os=${{ runner.os }}
          --runner-arch=${{ runner.arch }}

      - name: Configure the Windows isolation launcher
        if: runner.os == 'Windows'
        run: >-
          cmake -S native/milestone-5-native-isolation-launcher
          -B "${{ runner.temp }}/native-isolation-launcher"
          -A ${{ matrix.target.cmake_arch }}
          -DSOUNDSCAPER_NATIVE_TARGET=${{ matrix.target.native_target }}

      - name: Configure the macOS isolation launcher
        if: runner.os == 'macOS'
        run: >-
          cmake -S native/milestone-5-native-isolation-launcher
          -B "${{ runner.temp }}/native-isolation-launcher"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DSOUNDSCAPER_NATIVE_TARGET=${{ matrix.target.native_target }}

      - name: Compile the target-native isolation launcher
        run: >-
          cmake --build "${{ runner.temp }}/native-isolation-launcher"
          --config Release --parallel
          --target milestone5-native-isolation-launcher

  tests:
    name: Tests / ${{ matrix.shard }}
    needs: build
    strategy:
      fail-fast: false
      # Product ownership still separates Framescaper and Soundscaper tests.
      # The shared tests run in two stable filename-hash partitions, so a
      # four-core runner no longer carries the whole shared suite by itself.
      # Coverage is checked only after all four shards upload their profiles.
      matrix:
        shard: [common-1, common-2, framescaper, soundscaper]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # tests/milestone-5-package-audit.test.js reads revision-bound Git inputs from the real
          # checkout, so a shard cannot run against a depth-1 clone.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      # The gate proved this out: a restored tree costs seconds where `npm ci`
      # costs anywhere from twelve seconds to five minutes depending on how many
      # jobs are writing 891 packages at once.
      - name: Restore or install verified dependencies
        uses: ./.github/actions/verified-node-dependencies
        with:
          scope: ubuntu-24.04

      - name: Install virtual display for the native-helper Electron proof
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh xvfb

      - name: Allow unprivileged user namespaces for the native isolation launcher
        # ubuntu-24.04 images restrict unprivileged user namespaces through
        # AppArmor, so the milestone-5 launcher's unshare(CLONE_NEWUSER) fails
        # with EPERM and every real-child enforcement test fail-closes with
        # "The enforcement handshake ended early" before it can complete.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Resolve the selected test prerequisites
        id: test-prerequisites
        run: node scripts/ci-test-prerequisites.mjs --node-shard=${{ matrix.shard }} >> "$GITHUB_OUTPUT"

      - name: Resolve the interchange download cache identity
        if: steps.test-prerequisites.outputs.interchange == 'true'
        id: interchange-cache-key
        run: node scripts/provision-interchange-conformance.mjs --cache-key >> "$GITHUB_OUTPUT"

      - name: Restore verified interchange download inputs
        if: steps.test-prerequisites.outputs.interchange == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .wrangler/test-download-cache/interchange
          key: >-
            interchange-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.interchange-cache-key.outputs.key }}-${{ hashFiles('scripts/provision-interchange-conformance.mjs', 'scripts/lib/interchange-download-cache.mjs') }}

      - name: Provision interchange conformance reference tools
        if: steps.test-prerequisites.outputs.interchange == 'true'
        run: npm run provision:interchange-conformance

      - name: Restore authenticated Boost test headers
        if: matrix.shard == 'framescaper'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .wrangler/test-download-cache/boost
          key: >-
            boost-test-headers-v1-${{ hashFiles('config/boost-multiprecision-source-manifest.json', 'native/framescaper-media-host/source-manifest.json', 'scripts/lib/framescaper-boost-ci.mjs', 'scripts/lib/framescaper-boost-ci-cache.mjs') }}

      - name: Provision pinned Boost closure for Framescaper native tests
        if: matrix.shard == 'framescaper'
        run: node scripts/ci-provision-framescaper-boost.mjs

      - name: Restore Electron binary for the desktop protocol test
        if: matrix.shard == 'common-2'
        run: |
          if [ ! -x node_modules/electron/dist/electron ]; then
            node node_modules/electron/install.js
          fi
          test -x node_modules/electron/dist/electron

      - name: Download the fresh desktop test runtime
        if: matrix.shard == 'common-1' || matrix.shard == 'common-2'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-desktop-runtime-fixture-${{ github.sha }}
          path: .wrangler/node-desktop-runtime-fixture

      - name: Run the ${{ matrix.shard }} Node test shard
        run: xvfb-run --auto-servernum npm run test:shard -- --shard=${{ matrix.shard }} --require-linux-native --desktop-runtime-fixture=.wrangler/node-desktop-runtime-fixture
        env:
          # The headroom the suite has always run under. Nothing here merges
          # coverage — the shard only records raw V8 profiles — but a few tests
          # stage large buffers, and this keeps their limit what it was before the
          # split. The ubuntu-24.04 runner has 16 GiB, so it leaves plenty for
          # Electron and xvfb.
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Compact the shard's raw V8 coverage
        # Every test file leaves its own profile behind, each carrying a full copy
        # of the TypeScript source-map cache. Merging them and de-duplicating the
        # maps turns gigabytes into a single file the coverage job can consume.
        run: npm run coverage:compact -- coverage/shards/${{ matrix.shard }}.json

      - name: Upload the shard's coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/shards/${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Coverage
    # Keep this established aggregate check red/skipped when a target-native
    # compile fails, even on repositories whose branch rules predate the new
    # matrix job and require only the existing Coverage status.
    #
    # The browser matrix is here because its Chromium shards upload coverage of
    # their own: the union has to be scored over what the built site ran as well
    # as what the Node shards ran. It costs nothing on the critical path —
    # `deploy` already waits on both — only the moment the Coverage status
    # settles, which now trails the slowest browser shard.
    needs: [tests, native-platform-compile, browser, lint, typecheck, audits]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      - name: Download every shard's coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage/shards
          merge-multiple: true

      - name: Enforce the coverage thresholds over the union of the shards
        # V8 records absolute file URLs, so this only merges because every job
        # checks the repository out at the same path on the same runner image.
        run: npm run coverage:check

  browser:
    name: Browser / ${{ matrix.project }} ${{ matrix.shard }}/4
    needs: build
    strategy:
      fail-fast: false
      # Fit all three engines alongside Node and native checks in 19 slots.
      # Fewer shards keep the full suite and use longer execution budgets.
      matrix:
        project: [chromium, webkit]
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --user 1001
    # Four runners each take three former shards' one-hour allocation.
    timeout-minutes: 180
    env:
      SCAPE_BROWSER_PRODUCTS_PREPARED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: |
          npm install --global --prefix "$HOME/.local" npm@12.0.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The gate proved this out: a restored tree costs seconds where `npm ci`
      # costs anywhere from twelve seconds to five minutes depending on how many
      # jobs are writing 891 packages at once.
      # Keyed apart from the plain runners: same Ubuntu and same Node, but a
      # different image, so the container primes and reuses a tree of its own.
      - name: Restore the installed dependency tree
        id: dependency-tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: >-
            node-modules-playwright-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'patches/npm/*.patch') }}

      - name: Install dependencies
        if: steps.dependency-tree.outputs.cache-hit != 'true'
        run: npm ci

      - name: Resolve the selected test prerequisites
        id: test-prerequisites
        run: node scripts/ci-test-prerequisites.mjs --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4 >> "$GITHUB_OUTPUT"

      - name: Set up the interchange reference Python
        if: steps.test-prerequisites.outputs.interchange == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Resolve the interchange download cache identity
        if: steps.test-prerequisites.outputs.interchange == 'true'
        id: interchange-cache-key
        run: node scripts/provision-interchange-conformance.mjs --cache-key >> "$GITHUB_OUTPUT"

      - name: Restore verified interchange download inputs
        if: steps.test-prerequisites.outputs.interchange == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .wrangler/test-download-cache/interchange
          key: >-
            interchange-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.interchange-cache-key.outputs.key }}-${{ hashFiles('scripts/provision-interchange-conformance.mjs', 'scripts/lib/interchange-download-cache.mjs') }}

      - name: Provision interchange conformance readers
        if: steps.test-prerequisites.outputs.interchange == 'true'
        run: npm run provision:interchange-conformance

      - name: Download the verified website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-soundscaper-browser-site-build
          path: .wrangler/browser-products/soundscaper

      - name: Download the verified Framescaper website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-framescaper-site-build
          path: .wrangler/browser-products/framescaper

      # Beside each site rather than inside it: the sites are digest-verified
      # file by file, so nothing may be added within them. Every engine authenticates
      # served bytes; Chromium additionally authenticates and consumes the
      # sibling maps for coverage.
      - name: Download the website build's source maps
        if: matrix.project == 'chromium'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-site-source-maps
          path: .wrangler/browser-products/soundscaper-source-maps

      - name: Download the Framescaper website build's source maps
        if: matrix.project == 'chromium'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-framescaper-site-source-maps
          path: .wrangler/browser-products/framescaper-source-maps

      - name: Run browser workflows against the existing build
        run: npm run test:browser:built -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4 --workers=${{ matrix.project == 'webkit' && 1 || 2 }}
        env:
          # Chromium is the only engine whose V8 coverage Playwright can read, so
          # it is the only one that records. Every other project runs exactly as
          # it did before, with the collector inert.
          SCAPE_BROWSER_COVERAGE: ${{ matrix.project == 'chromium' && '1' || '' }}

      - name: Run the reciprocal-origin editable-copy workflow
        if: matrix.project == 'chromium' && matrix.shard == 1
        run: npm run test:browser:dual-origin

      - name: Download the checked Soundscaper handbook
        if: matrix.project == 'chromium' && matrix.shard == 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checked-soundscaper-handbook-${{ github.sha }}
          path: handbook

      - name: Run handbook browser workflows
        # Both desktop and mobile projects use the already checked handbook.
        if: matrix.project == 'chromium' && matrix.shard == 1
        run: |
          node scripts/ci-handbook-build.mjs verify
          npx playwright test --config playwright.docs.config.mjs

      - name: Compact the shard's browser coverage
        # One profile per test, each carrying the chunk maps that test was the
        # first to touch. Merged and de-duplicated they become one more shard for
        # the coverage job, named so its `coverage-shard-*` download picks it up.
        if: matrix.project == 'chromium'
        run: npm run coverage:compact:browser -- coverage/shards/browser-chromium-${{ matrix.shard }}.json

      - name: Upload the shard's browser coverage
        if: matrix.project == 'chromium'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-browser-chromium-${{ matrix.shard }}
          path: coverage/shards/browser-chromium-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload browser diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  firefox:
    name: Browser / firefox ${{ matrix.shard }}/4
    needs: build
    strategy:
      fail-fast: false
      # Share the same four-shard budget as Chromium and WebKit.
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    # Run 40315820118 spent 28 minutes installing Firefox and PulseAudio.
    # Keep setup separate from the three-hour consolidated test deadline.
    timeout-minutes: 210
    env:
      SCAPE_BROWSER_PRODUCTS_PREPARED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      # The gate proved this out: a restored tree costs seconds where `npm ci`
      # costs anywhere from twelve seconds to five minutes depending on how many
      # jobs are writing 891 packages at once.
      - name: Restore the installed dependency tree
        id: dependency-tree
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: >-
            node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc', 'package-lock.json', 'patches/npm/*.patch') }}

      - name: Install dependencies
        if: steps.dependency-tree.outputs.cache-hit != 'true'
        run: npm ci

      - name: Restore or install verified Playwright Firefox
        uses: ./.github/actions/verified-firefox
        with:
          scope: ubuntu-24.04

      - name: Install PulseAudio
        timeout-minutes: 10
        run: bash scripts/ci-apt-install.sh pulseaudio pulseaudio-utils

      - name: Configure the Firefox PulseAudio null sink and source
        run: bash scripts/ci-firefox-pulseaudio.sh

      - name: Require a live Firefox AudioContext clock
        run: node scripts/ci-firefox-audio-clock.mjs

      - name: Resolve the selected test prerequisites
        id: test-prerequisites
        run: node scripts/ci-test-prerequisites.mjs --project=firefox --shard=${{ matrix.shard }}/4 >> "$GITHUB_OUTPUT"

      - name: Set up the interchange reference Python
        if: steps.test-prerequisites.outputs.interchange == 'true'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Resolve the interchange download cache identity
        if: steps.test-prerequisites.outputs.interchange == 'true'
        id: interchange-cache-key
        run: node scripts/provision-interchange-conformance.mjs --cache-key >> "$GITHUB_OUTPUT"

      - name: Restore verified interchange download inputs
        if: steps.test-prerequisites.outputs.interchange == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .wrangler/test-download-cache/interchange
          key: >-
            interchange-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.interchange-cache-key.outputs.key }}-${{ hashFiles('scripts/provision-interchange-conformance.mjs', 'scripts/lib/interchange-download-cache.mjs') }}

      - name: Provision interchange conformance readers
        if: steps.test-prerequisites.outputs.interchange == 'true'
        run: npm run provision:interchange-conformance

      - name: Download the verified website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-soundscaper-browser-site-build
          path: .wrangler/browser-products/soundscaper

      - name: Download the verified Framescaper website build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-framescaper-site-build
          path: .wrangler/browser-products/framescaper

      - name: Run Firefox workflows against the existing build
        timeout-minutes: 180
        # A second Firefox content process can starve the live AudioContext even
        # after the PulseAudio clock probe passes. The four shard runners still
        # keep the suite parallel without competing for one runner's audio clock.
        run: npm run test:browser:built -- --project=firefox --shard=${{ matrix.shard }}/4 --workers=1

      - name: Upload Firefox diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics-firefox-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy
    # Every gate, not just the fast ones: the Node shards feed `coverage`, and
    # the browser matrices are the proof the built site actually runs.
    # Cloudflare's own git integration builds on push with no knowledge of any
    # of this, so it must be turned off in both projects or it will race us.
    needs: [coverage, browser, firefox, native-platform-compile]
    # Dispatch is authenticated by repository write access; publication additionally
    # requires explicit opt-in and the exact commit that all of these gates checked.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_translations == true &&
      inputs.translation_sync_sha == github.sha))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Never cancel a deploy midway, and never run two at once: a cancelled
    # `wrangler deploy` can leave a project on a half-uploaded asset set.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm
        run: npm install --global npm@12.0.1

      - name: Install dependencies
        run: npm ci

      # Both products build into ./dist, so each is built, shipped, and verified
      # in turn rather than in parallel. Framescaper goes first: Soundscaper's
      # retired document routes may point at the peer only after its root
      # receiver and editor have been verified live.
      #
      # framescaper.org is attached to the framescaper Pages project as its
      # custom domain and already carries a deployment, so this build audits it
      # directly: no SCAPE_DEPLOY_AUDIT_ORIGIN pointing the gate at the
      # project's *.pages.dev hostname, which would leave the hostname people
      # actually load unchecked, and no SCAPE_PAGES_COLD_START either. The
      # cold-start declaration excuses an origin that answers nothing at all,
      # and on a live origin it would turn an outage into a green deploy — the
      # preflight carries its own guard that fails the build if it is declared
      # while the origin answers.
      - name: Build Framescaper
        run: npm run build:pages
        env:
          SCAPE_PRODUCT: framescaper

      - name: Deploy Framescaper
        run: npx wrangler pages deploy dist --project-name=framescaper --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Framescaper deployment
        run: npm run verify:pages
        env:
          SCAPE_PRODUCT: framescaper

      - name: Build Soundscaper
        run: npm run build:pages
        env:
          SCAPE_PRODUCT: soundscaper

      - name: Deploy Soundscaper
        run: npx wrangler pages deploy dist --project-name=soundscaper --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Soundscaper deployment
        run: npm run verify:pages
        env:
          SCAPE_PRODUCT: soundscaper

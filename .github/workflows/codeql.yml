name: CodeQL

on:
  schedule:
    # Once a day, rather than on every push. Code scanning is a slow, broad
    # sweep whose findings rarely change commit to commit, so a nightly run
    # keeps the alerts current without occupying a runner on each push.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Every language is scanned without a build: the native hosts are not
        # compiled for analysis, so CodeQL reads the sources directly.
        language: [actions, c-cpp, javascript-typescript, python]
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js for the dependency-free tools bootstrap
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .nvmrc

      - name: Restore the pinned CodeQL bundle
        id: codeql-tools-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .wrangler/ci-input-cache/codeql
          key: codeql-tools-linux64-v1-${{ hashFiles('config/codeql-tools.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: codeql-tools-linux64-v1-${{ hashFiles('config/codeql-tools.json') }}-

      - name: Prepare and verify the CodeQL tools
        id: codeql-tools
        run: node scripts/ci-codeql-tools.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Save the verified CodeQL bundle before analysis
        if: steps.codeql-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .wrangler/ci-input-cache/codeql
          key: codeql-tools-linux64-v1-${{ hashFiles('config/codeql-tools.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          tools: ${{ steps.codeql-tools.outputs.archive }}
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}

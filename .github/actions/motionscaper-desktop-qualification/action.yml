name: Qualify complete native desktop Motion workflows
description: Target-native Windows and macOS launch, authored Save/export, independent scene reference and linked Frame successor workflows.
inputs:
  target:
    required: true
    description: Owned win-x64, win-arm64 or mac-arm64 target.
  platform:
    required: true
    description: Native Electron Builder platform, win or mac.
  arch:
    required: true
    description: Native x64 or arm64 architecture.
  native-result:
    required: true
    description: Absolute verified native helper result directory.
  motion-package:
    required: true
    description: Absolute target unpacked container directory for Motion.
runs:
  using: composite
  steps:
    - name: Download the separate source-bound test decoder
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: motionscaper-reference-decoder-${{ inputs.target }}
        path: ${{ runner.temp }}/motionscaper-reference-decoder
    - name: Prepare the explicitly isolated Frame successor stage
      shell: bash
      run: node scripts/desktop-prepare.mjs
      env:
        SCAPE_PRODUCT: framescaper
        SCAPE_FRAMESCAPER_LINE: successor
        SCAPE_FRAMESCAPER_DESKTOP_PROFILE: framescaper-successor-v2
        FRAMESCAPER_SUCCESSOR_NATIVE_BUILD_RESULT: ${{ inputs.native-result }}
        SOUNDSCAPER_SOURCE_REVISION: ${{ github.sha }}
        SOUNDSCAPER_DESKTOP_TARGET_PLATFORM: ${{ inputs.platform }}
        SOUNDSCAPER_DESKTOP_TARGET_ARCH: ${{ inputs.arch }}
    - name: Package the separate development successor without publication
      shell: bash
      run: >-
        npx electron-builder --config electron-builder.framescaper-successor.cjs
        --${{ inputs.platform }} --${{ inputs.arch }} --dir --publish never
      env:
        SCAPE_PRODUCT: framescaper
        SCAPE_FRAMESCAPER_LINE: successor
        SCAPE_FRAMESCAPER_DESKTOP_PROFILE: framescaper-successor-v2
    - name: Require all four real target-native packaged workflows
      shell: bash
      run: >-
        node scripts/motionscaper-desktop-qualification.ts
        --target=${{ inputs.target }} --native-result="${{ inputs.native-result }}"
        --decoder-artifact="${{ runner.temp }}/motionscaper-reference-decoder"
        --motion-stage="${{ github.workspace }}/.desktop-build"
        --motion-package="${{ inputs.motion-package }}"
        --successor-stage="${{ github.workspace }}/.desktop-build/framescaper-successor"
        --successor-package="${{ github.workspace }}/release/framescaper-successor/${{ inputs.platform == 'win' && (inputs.arch == 'x64' && 'win-unpacked' || 'win-arm64-unpacked') || 'mac-arm64' }}"
        --output="${{ runner.temp }}/motionscaper-desktop-qualification"
    - name: Retain source-bound receipts and failure diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: motionscaper-desktop-qualification-${{ inputs.target }}
        path: ${{ runner.temp }}/motionscaper-desktop-qualification/
        if-no-files-found: warn
        retention-days: 14
